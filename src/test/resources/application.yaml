quarkus:
  datasource:
    devservices:
      enabled: true
      image-name: postgres:16
      reuse: false
  flyway:
    migrate-at-start: true
  hibernate-orm:
    database:
      generation: validate
  log:
    category:
      "io.quarkus":
        level: WARN
      "org.hibernate.SQL":
        level: WARN
