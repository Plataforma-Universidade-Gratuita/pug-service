quarkus:
  http:
    test-port: 0
    test-ssl-port: 0
    cors:
      enabled: true
      origins:
        - http://localhost:3000
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
  datasource:
    devservices:
      enabled: true
      image-name: postgres:16
      reuse: false
  flyway:
    migrate-at-start: true
  hibernate-orm:
    schema-management:
      strategy: validate
    log:
      sql: false
      bind-parameters: false
  log:
    category:
      "org.hibernate":
        level: ERROR
      "org.hibernate.SQL":
        level: ERROR
      "org.hibernate.orm.jdbc":
        level: ERROR
      "io.quarkus":
        level: WARN
