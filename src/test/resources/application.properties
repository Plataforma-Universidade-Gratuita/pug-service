# ------------------------------ TEST PROFILE (WEG ENV) ------------------------------
%test.quarkus.http.test-port=0
%test.quarkus.http.test-ssl-port=0

# CORS
%test.quarkus.http.cors=true
%test.quarkus.http.cors.origins=http://localhost:3000
%test.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# --- DISABLE DEVSERVICES (Pulling from public internet) ---
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.mongodb.devservices.enabled=false
%test.quarkus.elasticsearch.devservices.enabled=false

# --- CONNECT TO LOCAL CONTAINERS (From your docker-compose.yml) ---
# PostgreSQL (Port 5433)
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/pug
%test.quarkus.datasource.username=pug
%test.quarkus.datasource.password=pug

# MongoDB (Port 27018)
%test.quarkus.mongodb.connection-string=mongodb://pug:pug@localhost:27018
%test.quarkus.mongodb.database=pug_audit
%test.quarkus.mongodb.uuid-representation=standard

# Elasticsearch (Port 9201)
%test.quarkus.hibernate-search-orm.elasticsearch.hosts=localhost:9201

# --- CONFIGURATION CONTINUED ---
# Flyway
%test.quarkus.flyway.migrate-at-start=true

# Hibernate ORM Logging
%test.quarkus.hibernate-orm.log.sql=false
%test.quarkus.hibernate-orm.log.bind-parameters=false

# Security & Auth (Isolated for Tests)
%test.security.password.pepper=test-only-pepper-123
%test.mp.jwt.verify.issuer=https://api.pug.test
%test.smallrye.jwt.new-token.issuer=https://api.pug.test
%test.smallrye.jwt.new-token.signature-algorithm=HS256
%test.smallrye.jwt.sign.key=dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLWp3dC1zaWduYXR1cmU=
%test.mp.jwt.verify.publickey=dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLWp3dC1zaWduYXR1cmU=

# Logging
%test.quarkus.log.category."org.hibernate".level=ERROR
%test.quarkus.log.category."org.hibernate.SQL".level=ERROR
%test.quarkus.log.category."org.hibernate.orm.jdbc".level=ERROR
%test.quarkus.log.category."io.quarkus".level=WARN