# ------------------------------ TEST SETTINGS ------------------------------
# HTTP
%test.quarkus.http.test-port=0
%test.quarkus.http.test-ssl-port=0

# CORS
%test.quarkus.http.cors=true
%test.quarkus.http.cors.origins=http://localhost:3000
%test.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# Enable Dev Services so tests provision their own containers instead of relying on pre-existing
# local infrastructure.
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16
%test.quarkus.mongodb.devservices.enabled=true
%test.quarkus.mongodb.devservices.image-name=mongo:7.0

# MongoDB
%test.quarkus.mongodb.database=pug_test_audit
%test.quarkus.mongodb.uuid-representation=standard

# Flyway
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.placeholders.seed_test_data_enabled=false


# Hibernate ORM logging
%test.quarkus.hibernate-orm.log.sql=false
%test.quarkus.hibernate-orm.log.bind-parameters=false

# Test-only security and JWT
%test.security.password.pepper=test-only-pepper-123
%test.mp.jwt.verify.issuer=https://api.pug.test
%test.smallrye.jwt.new-token.issuer=https://api.pug.test
%test.smallrye.jwt.new-token.signature-algorithm=HS256
%test.mp.jwt.verify.publickey.algorithm=HS256
%test.smallrye.jwt.sign.key={"kty":"oct","k":"dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLWp3dC1zaWduYXR1cmUtMjAyNg"}
%test.mp.jwt.verify.publickey={"kty":"oct","k":"dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLWp3dC1zaWduYXR1cmUtMjAyNg"}

# Logging
%test.quarkus.log.category."org.hibernate".level=ERROR
%test.quarkus.log.category."org.hibernate.SQL".level=ERROR
%test.quarkus.log.category."org.hibernate.orm.jdbc".level=ERROR
%test.quarkus.log.category."io.quarkus".level=WARN

# Application specific configs
%test.pug.seed.passwords.enabled=false