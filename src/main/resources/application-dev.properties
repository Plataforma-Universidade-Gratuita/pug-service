# ------------------------------ DEV SETTINGS ------------------------------
# Logging and terminal output
quarkus.log.category."br.org.catolicasc.pug".level=DEBUG
quarkus.log.console.level=DEBUG
quarkus.log.console.darken=0
quarkus.log.console.json=false

# Database observability
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=false

# HTTP access log
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=%h %r -> %s (%Ds) [user: %u] [cid: %{o,X-Correlation-Id}]
quarkus.http.access-log.exclude-pattern=/q/.*

# Testing
quarkus.datasource.dev-ui.allow-sql=true
quarkus.test.continuous-testing=paused

# Disable Dev Services and use local Docker Compose instead
quarkus.datasource.devservices.enabled=false
quarkus.mongodb.devservices.enabled=false

# Flyway
quarkus.flyway.placeholders.seed_test_data_enabled=true

# PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/pug
quarkus.datasource.username=pug
quarkus.datasource.password=pug

# MongoDB
quarkus.mongodb.connection-string=mongodb://pug:pug@localhost:27018
quarkus.mongodb.database=pug_audit

# HTTP, CORS, and Swagger UI
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.swagger-ui.path=/swagger-ui
quarkus.http.record-request-start-time=true

# Development JWT signing and verification key
smallrye.jwt.sign.key={"kty":"oct","k":"cHVnLXNlY3JldC1rZXktZm9yLWp3dC1zaWduYXR1cmUtMjAyNg"}
mp.jwt.verify.publickey={"kty":"oct","k":"cHVnLXNlY3JldC1rZXktZm9yLWp3dC1zaWduYXR1cmUtMjAyNg"}

# Application secrets
security.password.pepper=dev-only-32+chars-secret
security.qr.pepper=dev-only-32+chars-secret

# Application specific settings
pug.seed.passwords.enabled=true