services:
  # ── DEV CONTAINERS ────────────────────────────────────────────────────────
  postgres:
    image: registry-docker.weg.net/postgres:16
    container_name: pug-postgres
    ports: [ "5434:5432" ]
    environment:
      POSTGRES_USER: pug_test
      POSTGRES_PASSWORD: pug_test
      POSTGRES_DB: pug_test
    networks: [ pug-network ]

  mongodb:
    image: registry-docker.weg.net/mongo:7.0
    container_name: pug_test_audit
    ports: [ "27019:27017" ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: pug_test
      MONGO_INITDB_ROOT_PASSWORD: pug_test
    networks: [ pug-network ]

networks:
  pug-network:
    driver: bridge