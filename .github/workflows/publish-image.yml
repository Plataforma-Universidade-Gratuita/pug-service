name: Publish Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-image:
    name: Publish Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Ensure tag commit belongs to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Read Maven coordinates
        id: maven
        run: |
          VERSION=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          ARTIFACT_ID=$(./mvnw -q help:evaluate -Dexpression=project.artifactId -DforceStdout)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version v${VERSION}"
            exit 1
          fi

      - name: Prepare image metadata
        id: image
        run: |
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LOWER}/${{ steps.maven.outputs.artifact_id }}"
          SHORT_SHA="${GITHUB_SHA::12}"

          {
            echo "image=$IMAGE"
            echo "short_sha=$SHORT_SHA"
            echo "scan_tag=$IMAGE:scan"
            echo "sha_tag=$IMAGE:sha-$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

          TAGS="$IMAGE:sha-$SHORT_SHA"

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAGS="$TAGS,$IMAGE:latest"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAGS="$TAGS,$IMAGE:${GITHUB_REF_NAME},$IMAGE:${{ steps.maven.outputs.version }}"
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Verify
        run: ./mvnw -B clean verify

      - name: Set up Docker Buildx
        run: |
          docker buildx create --name pug-builder --use
          docker buildx inspect --bootstrap

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: Build image for scan
        run: |
          docker buildx build \
            --load \
            --tag "${{ steps.image.outputs.scan_tag }}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --file ./Dockerfile \
            .

      - name: Scan image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ steps.image.outputs.scan_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy results
        if: hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on critical or high vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ steps.image.outputs.scan_tag }}
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

      - name: Build and push image
        id: build
        run: |
          TAG_ARGS=""
          IFS=',' read -ra TAGS <<< "${{ steps.image.outputs.tags }}"
          for TAG in "${TAGS[@]}"; do
            TAG_ARGS="$TAG_ARGS --tag $TAG"
          done

          docker buildx build \
            --push \
            --platform linux/amd64,linux/arm64 \
            $TAG_ARGS \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${{ steps.maven.outputs.version }}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --file ./Dockerfile \
            .

          DIGEST=$(docker buildx imagetools inspect "${{ steps.image.outputs.sha_tag }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: |
          cosign sign --yes \
            "${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Print image digest
        run: |
          echo "Image: ${{ steps.image.outputs.image }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"