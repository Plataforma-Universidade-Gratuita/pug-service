name: Deploy Container App

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      azure_resource_group:
        required: true
        type: string
      azure_container_app:
        required: true
        type: string
      quarkus_profile:
        required: true
        type: string
      image:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}

    permissions:
      contents: read

    env:
      REGISTRY_SERVER: ghcr.io

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Container Apps extension
        run: az extension add --name containerapp --upgrade

      - name: Configure GHCR registry
        run: |
          az containerapp registry set \
            --name "${{ inputs.azure_container_app }}" \
            --resource-group "${{ inputs.azure_resource_group }}" \
            --server "$REGISTRY_SERVER" \
            --username "${{ secrets.GHCR_USERNAME }}" \
            --password "${{ secrets.GHCR_TOKEN }}"

      - name: Configure app secrets
        run: |
          az containerapp secret set \
            --name "${{ inputs.azure_container_app }}" \
            --resource-group "${{ inputs.azure_resource_group }}" \
            --secrets \
              db-url="${{ secrets.DB_URL }}" \
              db-user="${{ secrets.DB_USER }}" \
              db-pass="${{ secrets.DB_PASS }}" \
              mongodb-uri="${{ secrets.MONGODB_URI }}" \
              jwt-secret-key='${{ secrets.JWT_SECRET_KEY }}' \
              password-pepper="${{ secrets.PASSWORD_PEPPER }}" \
              qr-pepper="${{ secrets.QR_PEPPER }}"

      - name: Deploy revision
        run: |
          az containerapp update \
            --name "${{ inputs.azure_container_app }}" \
            --resource-group "${{ inputs.azure_resource_group }}" \
            --image "${{ inputs.image }}" \
            --set-env-vars \
              QUARKUS_PROFILE="${{ inputs.quarkus_profile }}" \
              DB_URL=secretref:db-url \
              DB_USER=secretref:db-user \
              DB_PASS=secretref:db-pass \
              MONGODB_URI=secretref:mongodb-uri \
              JWT_SECRET_KEY=secretref:jwt-secret-key \
              PASSWORD_PEPPER=secretref:password-pepper \
              QR_PEPPER=secretref:qr-pepper \
              CORS_ORIGINS="${{ vars.CORS_ORIGINS }}"

      - name: Print URL
        run: |
          FQDN=$(az containerapp show \
            --name "${{ inputs.azure_container_app }}" \
            --resource-group "${{ inputs.azure_resource_group }}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "Image: ${{ inputs.image }}"
          echo "URL: https://$FQDN"
          echo "Swagger: https://$FQDN/swagger-ui"