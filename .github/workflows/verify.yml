name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pug_test
          POSTGRES_PASSWORD: pug_test
          POSTGRES_DB: pug_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U pug_test -d pug_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mongo:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: pug_test
          MONGO_INITDB_ROOT_PASSWORD: pug_test
        ports:
          - 27019:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven verify
        run: ./mvnw -B clean verify