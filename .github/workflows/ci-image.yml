name: CI And Image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pug_test
          POSTGRES_PASSWORD: pug_test
          POSTGRES_DB: pug_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U pug_test -d pug_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: pug_test
          MONGO_INITDB_ROOT_PASSWORD: pug_test
        ports:
          - 27019:27017
        options: >-
          --health-cmd "mongosh mongodb://pug_test:pug_test@localhost:27017/admin --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Maven verify
        run: ./mvnw -B clean verify
        env:
          QUARKUS_DATASOURCE_DEVSERVICES_ENABLED: "false"
          QUARKUS_MONGODB_DEVSERVICES_ENABLED: "false"
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5434/pug_test
          QUARKUS_DATASOURCE_USERNAME: pug_test
          QUARKUS_DATASOURCE_PASSWORD: pug_test
          QUARKUS_MONGODB_CONNECTION_STRING: mongodb://pug_test:pug_test@localhost:27019

  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
