name: Deploy QA

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Full image to deploy, e.g. ghcr.io/plataforma-universidade-gratuita/pug-service:sha-abc123"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-container-app.yml
    with:
      environment_name: qa
      azure_resource_group: rg-pug-qa
      azure_container_app: pug-service-qa
      quarkus_profile: qa
      image: ${{ inputs.image }}
    secrets: inherit