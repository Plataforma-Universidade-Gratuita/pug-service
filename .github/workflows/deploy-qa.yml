name: Deploy QA

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-container-app.yml
    with:
      environment_name: qa
      azure_resource_group: rg-pug-qa
      azure_container_app: pug-service-qa
      quarkus_profile: qa
      image_tag_alias: qa
    secrets: inherit